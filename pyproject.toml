[project]
name = "bedsynth"
version = "1.0.0"
description = "BedSynth AI - SDV-based synthetic hospital bed-occupancy and scheduling data generator with a FastAPI service"
requires-python = ">=3.11"
readme = "README.md"

[tool.setuptools.packages.find]
include = ["bedsynth*"]

[tool.setuptools.package-data]
# The offline demo UI served at /ui must ship with non-editable installs.
bedsynth = ["api/static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: trains SDV models or runs the full simulator (deselect with -m 'not slow')",
    "integration: requires the prepared data/ and trained models/ produced by the pipeline scripts",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
    "ignore::UserWarning",
]
